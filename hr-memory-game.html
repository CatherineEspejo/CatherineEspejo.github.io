<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Match six pairs of HR-themed cards in this browser-based memory game.">
  <title>HR Memory Match</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23172a55'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='Arial' font-size='26' font-weight='700' fill='white'%3EHR%3C/text%3E%3C/svg%3E">
  <style>
    :root{--navy:#172a55;--blue:#3564df;--pink:#ed6ca6;--pale:#fff0f6;--ink:#17213b;--muted:#64708a;--white:#fff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 12%,#ffdcea 0,transparent 28rem),radial-gradient(circle at 90% 88%,#d6e3ff 0,transparent 30rem),linear-gradient(145deg,#fff9fc,#eef4ff)}
    main{width:min(900px,100%);padding:clamp(22px,4vw,40px);border:1px solid #dbe3f5;border-radius:30px;background:#ffffffd9;box-shadow:0 20px 55px #172a5526;backdrop-filter:blur(14px)}
    header{display:flex;align-items:end;justify-content:space-between;gap:22px;margin-bottom:22px}
    .eyebrow{margin:0 0 5px;color:var(--pink);font-size:.8rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
    h1{margin:0;color:var(--navy);font-size:clamp(2rem,5vw,3.5rem);line-height:1;letter-spacing:-.05em}
    .instructions{max-width:520px;margin:9px 0 0;color:var(--muted);font-size:1rem;line-height:1.5}
    button{font:inherit}
    .restart{min-height:46px;padding:0 20px;border:0;border-radius:999px;color:white;background:var(--navy);font-weight:750;cursor:pointer;box-shadow:0 8px 20px #172a5533;transition:.18s ease}
    .restart:hover{background:var(--blue);transform:translateY(-2px)}
    .restart:focus-visible,.card:focus-visible{outline:4px solid #ed6ca666;outline-offset:3px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:17px}
    .stat{padding:12px 15px;border:1px solid #e1e6f1;border-radius:16px;background:white}
    .stat>span{display:block;margin-bottom:2px;color:var(--muted);font-size:.76rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .stat strong{color:var(--navy);font-size:1.3rem}
    .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,2vw,15px);perspective:1000px}
    .card{position:relative;aspect-ratio:1/.92;padding:0;border:0;border-radius:19px;background:transparent;cursor:pointer;transform-style:preserve-3d;transition:transform .4s cubic-bezier(.2,.75,.25,1.15)}
    .card:hover:not(.flipped){transform:translateY(-4px)}
    .card.flipped,.card.matched{transform:rotateY(180deg)}
    .face{position:absolute;inset:0;display:grid;place-items:center;padding:9px;border-radius:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 9px 22px #172a5521}
    .back{border:3px solid white;color:white;background:linear-gradient(135deg,#ffffff1f 25%,transparent 25%) 0 0/24px 24px,linear-gradient(315deg,#ffffff17 25%,transparent 25%) 0 0/24px 24px,linear-gradient(145deg,var(--navy),var(--blue))}
    .mark{display:grid;place-items:center;width:55%;aspect-ratio:1;border:2px solid #ffffffbb;border-radius:50%;font-size:clamp(1.4rem,4vw,2.5rem);font-weight:900;letter-spacing:-.08em;background:#ffffff17}
    .front{grid-template-rows:1fr auto;gap:5px;border:2px solid #ffe0ed;background:white;color:var(--navy);transform:rotateY(180deg)}
    .icon{align-self:end;font-size:clamp(2rem,6vw,3.5rem);line-height:1;filter:drop-shadow(0 5px 7px #172a551f)}
    .label{align-self:start;font-size:clamp(.74rem,2vw,.95rem);font-weight:800;line-height:1.15;text-align:center}
    .matched .front{border-color:var(--pink);background:linear-gradient(145deg,#fff,var(--pale));animation:pop .42s ease}
    .message{min-height:26px;margin:17px 0 0;color:var(--navy);font-weight:750;text-align:center}
    .overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:#172a557a;backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:.25s ease}
    .overlay.show{opacity:1;visibility:visible}
    .win{width:min(430px,100%);padding:34px;border-radius:28px;background:white;box-shadow:0 20px 55px #172a5540;text-align:center;transform:scale(.9);transition:.3s ease}
    .overlay.show .win{transform:scale(1)}
    .trophy{display:block;font-size:4rem}.win h2{margin:4px 0 8px;color:var(--navy);font-size:2rem}.win p{margin:0 0 22px;color:var(--muted);line-height:1.55}
    @keyframes pop{50%{transform:rotateY(180deg) scale(1.07)}}
    @media(max-width:650px){body{padding:11px;align-items:start}main{margin-top:6px;border-radius:23px}header{align-items:start;flex-direction:column;gap:13px}.restart{width:100%}.board{grid-template-columns:repeat(3,minmax(0,1fr))}.card{aspect-ratio:1/1.02;border-radius:15px}}
    @media(max-width:390px){main{padding:17px}.stats{gap:6px}.stat{padding:9px 7px;text-align:center}.stat strong{font-size:1.08rem}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">People + Technology</p><h1>HR Memory Match</h1><p class="instructions">Flip two cards at a time and match all six HR pairs. The timer begins with your first card.</p></div>
      <button class="restart" id="restart" type="button">New game</button>
    </header>
    <section class="stats" aria-label="Game statistics">
      <div class="stat"><span>Moves</span><strong id="moves">0</strong></div>
      <div class="stat"><span>Matches</span><strong><b id="matches">0</b>/6</strong></div>
      <div class="stat"><span>Time</span><strong id="timer">0:00</strong></div>
    </section>
    <section class="board" id="board" aria-label="HR memory cards"></section>
    <p class="message" id="message" aria-live="polite">Choose a card to begin.</p>
  </main>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="win"><span class="trophy" aria-hidden="true">🏆</span><h2 id="winTitle">Great match!</h2><p id="winCopy"></p><button class="restart" id="again" type="button">Play again</button></div>
  </div>
  <script>
    const themes=[
      {id:"hris",icon:"💻",label:"HRIS"},{id:"recruiting",icon:"🔎",label:"Recruiting"},
      {id:"payroll",icon:"💵",label:"Payroll"},{id:"benefits",icon:"🩺",label:"Benefits"},
      {id:"learning",icon:"🎓",label:"Learning"},{id:"engagement",icon:"🤝",label:"Engagement"}
    ];
    const board=document.querySelector("#board"),movesEl=document.querySelector("#moves"),matchesEl=document.querySelector("#matches"),timerEl=document.querySelector("#timer"),message=document.querySelector("#message"),overlay=document.querySelector("#overlay"),winCopy=document.querySelector("#winCopy");
    let first=null,second=null,locked=false,moves=0,matches=0,seconds=0,timer=null,started=false;
    const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    const clock=n=>`${Math.floor(n/60)}:${String(n%60).padStart(2,"0")}`;
    function startTimer(){if(started)return;started=true;timer=setInterval(()=>{seconds++;timerEl.textContent=clock(seconds)},1000)}
    function createCard(theme,index){const card=document.createElement("button");card.type="button";card.className="card";card.dataset.theme=theme.id;card.setAttribute("aria-label",`Hidden memory card ${index+1}`);card.setAttribute("aria-pressed","false");card.innerHTML=`<span class="face back" aria-hidden="true"><span class="mark">HR</span></span><span class="face front"><span class="icon" aria-hidden="true">${theme.icon}</span><span class="label">${theme.label}</span></span>`;card.addEventListener("click",()=>flip(card,theme));return card}
    function flip(card,theme){if(locked||card===first||card.classList.contains("matched"))return;startTimer();card.classList.add("flipped");card.setAttribute("aria-pressed","true");card.setAttribute("aria-label",`${theme.label} card`);if(!first){first=card;message.textContent=`${theme.label} selected. Find its match.`;return}second=card;moves++;movesEl.textContent=moves;compare()}
    function compare(){if(first.dataset.theme===second.dataset.theme){first.classList.add("matched");second.classList.add("matched");first.disabled=second.disabled=true;matches++;matchesEl.textContent=matches;message.textContent="Match found! Keep going.";resetTurn();if(matches===themes.length)finish();return}locked=true;message.textContent="Not a match—try again.";setTimeout(()=>{[first,second].forEach(c=>{c.classList.remove("flipped");c.setAttribute("aria-pressed","false");c.setAttribute("aria-label","Hidden memory card")});resetTurn()},850)}
    function resetTurn(){first=second=null;locked=false}
    function finish(){clearInterval(timer);message.textContent="You matched every HR pair!";winCopy.textContent=`You completed the board in ${moves} moves and ${clock(seconds)}.`;setTimeout(()=>{overlay.classList.add("show");document.querySelector("#again").focus()},500)}
    function newGame(){clearInterval(timer);first=second=null;locked=false;moves=matches=seconds=0;started=false;movesEl.textContent=matchesEl.textContent="0";timerEl.textContent="0:00";message.textContent="Choose a card to begin.";overlay.classList.remove("show");board.replaceChildren();shuffle([...themes,...themes]).forEach((t,i)=>board.appendChild(createCard(t,i)))}
    document.querySelector("#restart").addEventListener("click",newGame);document.querySelector("#again").addEventListener("click",newGame);overlay.addEventListener("click",e=>{if(e.target===overlay)newGame()});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&overlay.classList.contains("show"))newGame()});newGame();
  </script>
</body>
</html>
