<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A blue and pink Tic-Tac-Toe game where you play against the computer.">
  <title>Blue & Pink Tic-Tac-Toe</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23142d62'/%3E%3Cpath d='m14 15 16 16m0-16L14 31' stroke='%234c8dff' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='44' cy='42' r='10' fill='none' stroke='%23ff70b5' stroke-width='7'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --navy: #142d62;
      --blue: #3979ee;
      --blue-light: #dbe9ff;
      --pink: #f05aa4;
      --pink-light: #ffe0ef;
      --ink: #17213c;
      --muted: #68738d;
      --white: #fff;
      --shadow: 0 22px 55px rgba(20,45,98,.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      overflow-x: hidden;
      font-family: Inter, ui-rounded, "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 14%, rgba(240,90,164,.24), transparent 26rem),
        radial-gradient(circle at 88% 84%, rgba(57,121,238,.25), transparent 29rem),
        linear-gradient(145deg, #fff7fb, #edf4ff);
    }

    .game {
      width: min(720px, 100%);
      padding: clamp(24px, 5vw, 46px);
      border: 1px solid rgba(57,121,238,.14);
      border-radius: 32px;
      background: rgba(255,255,255,.86);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 18px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--pink);
      font-size: .8rem;
      font-weight: 850;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(2rem, 6vw, 3.6rem);
      line-height: .98;
      letter-spacing: -.055em;
    }

    .subtitle {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .mini-marks {
      display: flex;
      gap: 6px;
      padding-top: 4px;
      font-size: clamp(2rem, 7vw, 3.5rem);
      font-weight: 900;
      line-height: 1;
    }

    .x { color: var(--blue); }
    .o { color: var(--pink); }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .score {
      padding: 12px 10px;
      border: 1px solid #e3e8f2;
      border-radius: 16px;
      background: var(--white);
      text-align: center;
    }

    .score span {
      display: block;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .score strong {
      display: block;
      margin-top: 1px;
      color: var(--navy);
      font-size: 1.4rem;
    }

    .status {
      min-height: 31px;
      margin: 0 0 14px;
      color: var(--navy);
      font-size: 1.1rem;
      font-weight: 800;
      text-align: center;
    }

    .board {
      width: min(460px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(8px, 2vw, 13px);
    }

    .cell {
      position: relative;
      aspect-ratio: 1;
      border: 2px solid rgba(20,45,98,.08);
      border-radius: clamp(16px, 4vw, 24px);
      background: var(--white);
      box-shadow: 0 9px 22px rgba(20,45,98,.1);
      cursor: pointer;
      font: inherit;
      font-size: clamp(3.2rem, 14vw, 6.2rem);
      font-weight: 900;
      line-height: 1;
      transition: transform .16s ease, border-color .2s ease, background .2s ease;
    }

    .cell:hover:empty { transform: translateY(-3px); border-color: rgba(57,121,238,.4); }
    .cell:disabled { cursor: default; }
    .cell:focus-visible { outline: 4px solid rgba(240,90,164,.36); outline-offset: 3px; }
    .cell.blue { color: var(--blue); animation: markIn .28s ease; }
    .cell.pink { color: var(--pink); animation: markIn .28s ease; }
    .cell.win { border-color: var(--pink); background: linear-gradient(145deg, var(--blue-light), var(--pink-light)); animation: winPulse .75s ease infinite alternate; }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .control {
      min-height: 46px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }

    .primary { color: white; background: linear-gradient(135deg, var(--blue), var(--navy)); box-shadow: 0 8px 20px rgba(20,45,98,.22); }
    .secondary { color: var(--navy); background: var(--pink-light); }
    .control:hover { transform: translateY(-2px); }
    .control:focus-visible { outline: 4px solid rgba(240,90,164,.36); outline-offset: 3px; }

    .legend {
      display: flex;
      justify-content: center;
      gap: 22px;
      margin-top: 18px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 700;
    }

    .dot { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 50%; }
    .dot.blue { background: var(--blue); }
    .dot.pink { background: var(--pink); }

    @keyframes markIn { from { opacity: 0; transform: scale(.55) rotate(-10deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes winPulse { to { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(240,90,164,.22); } }

    @media (max-width: 520px) {
      body { padding: 11px; align-items: start; }
      .game { margin-top: 6px; padding: 22px 17px; border-radius: 24px; }
      .title-row { margin-bottom: 18px; }
      .mini-marks { display: none; }
      .scoreboard { gap: 6px; }
      .score { padding: 10px 5px; }
      .score strong { font-size: 1.18rem; }
      .controls { flex-direction: column; }
      .control { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header class="title-row">
      <div>
        <p class="eyebrow">You vs. Computer</p>
        <h1>Tic-Tac-Toe</h1>
        <p class="subtitle">You’re blue X. Get three in a row before the pink O.</p>
      </div>
      <div class="mini-marks" aria-hidden="true"><span class="x">X</span><span class="o">O</span></div>
    </header>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score"><span>You</span><strong id="playerScore">0</strong></div>
      <div class="score"><span>Draws</span><strong id="drawScore">0</strong></div>
      <div class="score"><span>Computer</span><strong id="computerScore">0</strong></div>
    </section>

    <p class="status" id="status" aria-live="polite">Your turn—choose a square.</p>
    <section class="board" id="board" aria-label="Tic-Tac-Toe board"></section>

    <div class="controls">
      <button class="control primary" id="newRound" type="button">New round</button>
      <button class="control secondary" id="resetScore" type="button">Reset score</button>
    </div>

    <div class="legend" aria-label="Player colors">
      <span><i class="dot blue"></i>You: X</span>
      <span><i class="dot pink"></i>Computer: O</span>
    </div>
  </main>

  <script>
    const winningLines = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    const boardEl = document.querySelector('#board');
    const statusEl = document.querySelector('#status');
    const playerScoreEl = document.querySelector('#playerScore');
    const drawScoreEl = document.querySelector('#drawScore');
    const computerScoreEl = document.querySelector('#computerScore');

    let board = Array(9).fill('');
    let gameOver = false;
    let computerThinking = false;
    let scores = { player: 0, draws: 0, computer: 0 };

    function createBoard() {
      boardEl.replaceChildren();
      board.forEach((mark, index) => {
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'cell';
        cell.dataset.index = index;
        cell.setAttribute('aria-label', `Square ${index + 1}, empty`);
        cell.addEventListener('click', () => playSquare(index));
        boardEl.appendChild(cell);
      });
    }

    function playSquare(index) {
      if (gameOver || computerThinking || board[index]) return;
      placeMark(index, 'X');
      const result = getResult();
      if (result) return finishRound(result);

      computerThinking = true;
      statusEl.textContent = 'Pink O is thinking…';
      disableEmptyCells(true);
      window.setTimeout(computerMove, 430);
    }

    function computerMove() {
      const index = chooseComputerMove();
      if (index !== undefined) placeMark(index, 'O');
      computerThinking = false;
      const result = getResult();
      if (result) return finishRound(result);
      disableEmptyCells(false);
      statusEl.textContent = 'Your turn—choose a square.';
    }

    function chooseComputerMove() {
      const open = board.map((mark, index) => mark ? null : index).filter(index => index !== null);
      const winning = findCompletingMove('O', open);
      if (winning !== null) return winning;
      const blocking = findCompletingMove('X', open);
      if (blocking !== null) return blocking;
      if (!board[4]) return 4;
      const corners = [0,2,6,8].filter(index => !board[index]);
      if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
      return open[Math.floor(Math.random() * open.length)];
    }

    function findCompletingMove(mark, open) {
      for (const index of open) {
        board[index] = mark;
        const wins = winningLines.some(line => line.every(cell => board[cell] === mark));
        board[index] = '';
        if (wins) return index;
      }
      return null;
    }

    function placeMark(index, mark) {
      board[index] = mark;
      const cell = boardEl.children[index];
      cell.textContent = mark;
      cell.classList.add(mark === 'X' ? 'blue' : 'pink');
      cell.setAttribute('aria-label', `Square ${index + 1}, ${mark}`);
      cell.disabled = true;
    }

    function getResult() {
      for (const line of winningLines) {
        const [a,b,c] = line;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) return { winner: board[a], line };
      }
      return board.every(Boolean) ? { winner: 'draw', line: [] } : null;
    }

    function finishRound(result) {
      gameOver = true;
      disableEmptyCells(true);
      result.line.forEach(index => boardEl.children[index].classList.add('win'));

      if (result.winner === 'X') {
        scores.player += 1;
        statusEl.textContent = 'You won! Blue X takes the round. 🎉';
      } else if (result.winner === 'O') {
        scores.computer += 1;
        statusEl.textContent = 'Pink O won this round. Try again!';
      } else {
        scores.draws += 1;
        statusEl.textContent = 'It’s a draw—great defense!';
      }
      updateScores();
    }

    function disableEmptyCells(disabled) {
      [...boardEl.children].forEach((cell, index) => {
        if (!board[index]) cell.disabled = disabled;
      });
    }

    function updateScores() {
      playerScoreEl.textContent = scores.player;
      drawScoreEl.textContent = scores.draws;
      computerScoreEl.textContent = scores.computer;
    }

    function newRound() {
      board = Array(9).fill('');
      gameOver = false;
      computerThinking = false;
      statusEl.textContent = 'Your turn—choose a square.';
      createBoard();
    }

    function resetScore() {
      scores = { player: 0, draws: 0, computer: 0 };
      updateScores();
      newRound();
    }

    document.querySelector('#newRound').addEventListener('click', newRound);
    document.querySelector('#resetScore').addEventListener('click', resetScore);
    createBoard();
  </script>
</body>
</html>
